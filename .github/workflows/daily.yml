name: Palestine Archive Daily Publisher

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC = 09:00 Amman
    - cron: '0 6 * * *'

permissions:
  contents: write

concurrency:
  group: daily-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests Pillow
          fi

      - name: Generate and Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python daily_bot.py

      - name: Upload generated image as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village-image
          path: output/*.jpg
          if-no-files-found: ignore
